<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 260px;
      --accent: #0969da;
      --accent-light: #ddf4ff;
      --border: #d0d7de;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --code-bg: #f6f8fa;
      --sidebar-bg: #f6f8fa;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
    }

    /* ── 整体布局 ── */
    .layout {
      display: flex;
      min-height: 100vh;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── 侧边栏 ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
    }
    .sidebar-inner {
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      padding: 28px 16px 40px;
    }
    .sidebar-inner::-webkit-scrollbar { width: 4px; }
    .sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-inner nav#TOC {
      font-size: 13px;
    }
    .sidebar-inner nav#TOC > p,
    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-inner nav#TOC ul {
      list-style: none;
      padding-left: 0;
    }
    .sidebar-inner nav#TOC ul ul {
      padding-left: 12px;
      border-left: 1px solid var(--border);
      margin-left: 4px;
    }
    .sidebar-inner nav#TOC li {
      margin: 2px 0;
    }
    .sidebar-inner nav#TOC a {
      display: block;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--muted);
      text-decoration: none;
      line-height: 1.5;
      transition: background .15s, color .15s;
    }
    .sidebar-inner nav#TOC a:hover {
      background: #e8f0fe;
      color: var(--accent);
    }
    .sidebar-inner nav#TOC > ul > li > a {
      color: var(--text);
      font-weight: 500;
    }

    /* ── 主内容 ── */
    .content {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      padding: 48px 64px 80px;
      border-right: 1px solid var(--border);
    }

    /* ── 标题 ── */
    h1 {
      font-size: 1.9em;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      padding-bottom: .4em;
      margin-bottom: .8em;
    }
    h2 {
      font-size: 1.4em;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: .3em;
      margin-top: 2.2em;
      margin-bottom: .6em;
    }
    h3 {
      font-size: 1.3em;
      font-weight: 700;
      color: var(--text);
      margin-top: 1.8em;
      margin-bottom: .4em;
    }
    h4 {
      font-size: 1.1em;
      font-weight: 700;
      color: var(--muted);
      margin-top: 1.4em;
      margin-bottom: .3em;
    }

    /* ── 文本 ── */
    p { margin: .5em 0 .8em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    strong { font-weight: 600; }
    ul, ol { padding-left: 1.6em; margin: .4em 0 .8em; }
    li { margin: .2em 0; }

    /* ── 代码 ── */
    code {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .875em;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .1em .4em;
      color: #cf222e;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
      overflow-x: auto;
      font-size: 1em;
      line-height: 1.8;
      margin: .8em 0 1em;
    }
    pre code { background: none; border: none; padding: 0; color: inherit; }

    /* ── 引用 ── */
    blockquote {
      border-left: 4px solid var(--accent);
      background: var(--accent-light);
      margin: 1em 0;
      padding: .6em 1em;
      border-radius: 0 6px 6px 0;
      color: var(--muted);
    }
    blockquote p { margin: 0; }

    /* ── 表格 ── */
    table {
      border-collapse: collapse;
      width: auto;
      max-width: 100%;
      margin: .8em 0 1.4em;
      font-size: .9em;
      table-layout: auto;
    }
    /* 覆盖 pandoc 自动生成的等分列宽，让浏览器按内容自动分配 */
    col { width: auto !important; }
    th {
      background: #edf4ff;
      color: var(--accent);
      font-weight: 600;
      text-align: left;
      padding: 8px 14px;
      border: 1px solid #c8e1ff;
      white-space: nowrap;
    }
    td {
      padding: 7px 14px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    tr:nth-child(even) td { background: #f9fafb; }
    tr:hover td { background: #f0f7ff; }

    /* ── 打印 ── */
    @media print {
      .sidebar { display: none; }
      .content { padding: 0; border: none; }
      body { background: white; }
    }

    /* ── 窄屏折叠侧边栏 ── */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 24px 20px 60px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-title">目录</div>
      $table-of-contents$
    </div>
  </aside>
  <main class="content">
    $body$
  </main>
</div>
</body>
</html>
